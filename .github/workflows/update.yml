name: update
# Live since 14 Nov 2026, modelled on Headwind's. Every 6 hours (meant to be started by the hub's tic-dispatch Worker, because GitHub fires schedules 4-9 h late;
# its own cron is the fallback), on every push to main, and by hand: the tests, the last run's snapshot from this
# repository's Actions cache, a live collection, the site build and check, then a deploy of site/ to Cloudflare
# Pages. The publishers disclose twice a year to quarterly, so 6 hours is plenty.
#
# State: a failed lane keeps its last good copy, which needs the run before's data/snapshot.json. It is kept in the
# Actions cache (private to the repository). The raw copies in data/raw/ hold the publishers' full pages, Meta's
# indicator tables included, so they are never cached, committed or published.
#
# Secrets: CLOUDFLARE_PAGES_TOKEN (Cloudflare Pages: Edit) and the account ID as repo variable CLOUDFLARE_ACCOUNT_ID.
# Without the Cloudflare pair everything runs except the deploy. GITHUB_TOKEN (provided by Actions) is passed to
# the collect step only, for the one GitHub API call that reads when Meta added each indicator file (a higher rate
# limit than an anonymous call); it is never recorded. No other key is needed: every source is keyless.
#
# History (from 16 Nov 2026, the kit's tic-history/1, doctrine/kit/docs/history-log.md): after the check, the kit
# compares the feed with history/state.json and writes one line per item that is new, changed or ended to
# history/log/YYYY/MM/DD.jsonl, and the items ended in the last 7 days to site/data/ended.geojson (deployed with the
# site, read by COP). The feed's `health` block, keyed by source id, says which lanes were read; a lane that failed
# ends nothing. history/ holds only published feed items (operation level), never data/raw or the snapshot. It is
# committed to main by the workflow's token, which starts no further run. A failure there is a gap in the history,
# never a missed deploy.
#
# Private archive (the last two steps, secret TIC_ARCHIVE_TOKEN): every run's raw replies, history/, run snapshot
# and deployed site/ also go to the PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is
# replaced or deleted. The run snapshot is otherwise kept only in the Actions cache (evicted after 7 days unused),
# site/ is replaced by the next deploy (and site/data/ended.geojson holds only the last 7 days of ended items), and
# the archive keeps every version. When the cache has no snapshot, the run restores the newest one from the archive.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write     # the history/ commit
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests (offline, recorded real replies)
        run: python -m unittest discover -s tests
      - name: Doctrine registers, and the vendored kit copy unedited
        run: |
          python doctrine/kit/tic.py registers doctrine
          python doctrine/kit/tic.py kitcheck
      - name: Last run's snapshot from the Actions cache (none on the first run)
        id: state
        uses: actions/cache/restore@v6
        with:
          path: data/snapshot.json
          key: undertow-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: undertow-state-
      # Then the private archive: its lane `state` holds the run snapshot of every run whose last check passed. The
      # restore goes to a temporary folder first and is copied into data/ only when it finished, so a broken
      # download never leaves half a snapshot behind. With neither, the run goes on as a first run.
      - name: No cache entry, so the snapshot from the private archive
        if: steps.state.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ] && python tools/tic_archive.py restore --program undertow --lane state \
               --dest "$RUNNER_TEMP/archive-state" && [ -f "$RUNNER_TEMP/archive-state/snapshot.json" ]; then
            mkdir -p data && cp -R "$RUNNER_TEMP/archive-state/." data/
            echo "::warning::No snapshot in the Actions cache; restored the newest copy kept in the private archive."
          else
            echo "::warning::No snapshot in the Actions cache or the private archive, so a lane that fails this run has no last good copy."
          fi
      - name: Live collection (a failed lane keeps its last good copy and says so on the page)
        run: python tools/undertow.py collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build site/
        run: python tools/undertow.py build
      - name: Check (registers, feed linter, STIX, leak scan)
        run: python tools/undertow.py check
      # The run's checkout can be older than main: a run queued behind another starts from the commit that
      # triggered it, without the history commit the run before made. So history/ is taken from main's tip first,
      # and the commit is made on main's tip with only history/ staged (reset --mixed moves HEAD and the index,
      # never the working tree, which holds the build's site/ files). No rebase, so nothing unstaged can stop it.
      - name: History (history/, and site/data/ended.geojson)
        id: history
        run: |
          git fetch -q --depth=1 origin main && git checkout -q FETCH_HEAD -- history 2>/dev/null \
            || echo "::warning::could not take history/ from main's tip; using this checkout's"
          # Retention archive (history/reports.jsonl): the reporter lanes' report records, append-only, written
          # on top of main's tip just taken and committed below with the rest of history/.
          python tools/undertow.py archive || echo "::warning::archive step failed; this run is missing from reports.jsonl"
          python doctrine/kit/tic.py history site/data/feed.geojson --dir history --ended site/data/ended.geojson --fill-last-change \
            || { echo "::warning::history step failed; this run is missing from history/"; exit 0; }
          git config user.name "undertow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp="history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main && git reset -q --mixed FETCH_HEAD || { sleep $((i * 15)); continue; }
            git add history
            git diff --cached --quiet -- history && { echo "history: nothing new"; exit 0; }
            git commit -q -m "$stamp" && git push -q origin HEAD:main && exit 0
            echo "::warning::history push attempt $i failed"
            sleep $((i * 15))
          done
          echo "::warning::history not committed this run; the next run logs these changes again from the last state"
      - name: Check again, now with site/data/ended.geojson in the leak scan
        id: recheck
        run: python tools/undertow.py check
      - name: Keep this run's snapshot for the next run
        uses: actions/cache/save@v6
        with:
          path: data/snapshot.json
          key: undertow-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          # Cloudflare's API fails now and then with nothing wrong here ("An unknown error occurred ... [code: 8000000]"),
          # which failed the run and mailed an alert. Try three times, 20 s and 60 s apart.
          for wait in 0 20 60; do
            if [ "$wait" != 0 ]; then echo "::warning::Cloudflare deploy failed; trying again in ${wait} s"; sleep "$wait"; fi
            if npx --yes wrangler@4.151.3 pages deploy site --project-name undertow --branch main \
                 --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true; then
              exit 0
            fi
          done
          echo "::error::Cloudflare Pages deploy failed three times"; exit 1
      # Private archive (19 Nov 2026, retention rule: no data lost). OpenAI's RSS and the reporter pages roll off and
      # publishers edit pages, so the raw replies go to the PRIVATE repo metacog-osint/tic-archive as release assets
      # (tools/tic_archive.py, release undertow-raw-YYYY-MM: a snapshot per run, only changed replies uploaded).
      # Operation level only still holds (Tom, 19 Nov 2026): Meta's per-network files (indicator values) and the
      # reporter lanes' pages (reporter text) are left out, one --exclude per lane in undertow/reporters.py
      # (tests/test_private_archive.py holds it). Never to this public repo's releases, artifacts or logs.
      # After the deploy, so a failure turns the run red but never holds the live site. Token: TIC_ARCHIVE_TOKEN,
      # contents:write on tic-archive only.
      - name: Private archive (raw replies, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so nothing went to the private archive"; exit 1
          fi
          python tools/tic_archive.py put --program undertow --lane raw --src data/raw \
            --exclude 'meta-network/*' \
            --exclude 'dfrlab-rss/*' --exclude 'checkfirst-rss/*' --exclude 'correctiv-rss/*'
      # What this public repository keeps only for a while or replaces, to the same private archive, one lane each
      # (release undertow-<lane>-YYYY-MM; a snapshot per run, only changed files uploaded, nothing replaced):
      #   history  history/ as the History step left it: the kit's history log and state.json, and reports.jsonl.
      #            Committed to main too. Only when that step ran, so a run that stopped earlier never archives an
      #            older checkout's history/ as the newest snapshot.
      #   state    data/ without data/raw (its own lane above): the run snapshot, which the Actions cache keeps for
      #            7 days. Only once the last check passed, so it is a snapshot the next run may use (the restore
      #            near the top reads it when the cache has none). data/triage.jsonl is never in it: that list
      #            holds reporters' headlines and is made on the laptop only, never in Actions.
      #   site     site/ as deployed: every published file, feed.geojson, stix.json, events.json and ended.geojson
      #            (COP) among them, each replaced by the next deploy. Only when the deploy step succeeded.
      # Operation level only, as on the site: the snapshot and history/ hold no Meta indicator values and no
      # reporter text (tests/test_archive_lanes.py holds it), so nothing is redacted and the archived bytes match
      # the public copy. Each lane is tried even if another failed; any failure turns the run red after the live
      # site is updated.
      - name: Private archive (history, run snapshot and site, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          HISTORY: ${{ steps.history.outcome }}
          CHECKED: ${{ steps.recheck.outcome }}
          DEPLOYED: ${{ steps.deploy.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so history/, the run snapshot and site/ did not reach the private archive"; exit 1
          fi
          failed=0
          if [ "$HISTORY" = "success" ]; then
            python tools/tic_archive.py put --program undertow --lane history --src history || failed=1
          else
            echo "history: the History step did not run, so history/ was not archived"
          fi
          if [ "$CHECKED" = "success" ]; then
            python tools/tic_archive.py put --program undertow --lane state --src data \
              --exclude 'raw/*' --exclude 'triage.jsonl' || failed=1
          else
            echo "state: the last check did not pass this run, so the snapshot was not archived"
          fi
          if [ "$DEPLOYED" = "success" ]; then
            python tools/tic_archive.py put --program undertow --lane site --src site || failed=1
          else
            echo "site: not deployed this run, so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
